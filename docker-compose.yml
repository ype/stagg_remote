services:
  stagg-remote:
    build: .
    image: stagg-remote:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      STAGG_KETTLE_URL: ${STAGG_KETTLE_URL:?set STAGG_KETTLE_URL, e.g. http://192.168.0.58}
      TZ: ${TZ:-Europe/London}
    volumes:
      - ./data:/data
