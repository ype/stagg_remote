[project]
name = "stagg-remote"
version = "0.1.0"
description = "Wake-up timer web app for the Fellow Stagg EKG Pro kettle (local LAN control)"
authors = [
    {name = "Anton",email = "anton@env.sh"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic-settings (>=2.16.1,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.1,<2.0.0)",
    "ruff (>=0.17.2,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)"
]

[tool.poetry]
packages = [{ include = "stagg_remote", from = "src" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
strict = true
files = ["src"]
